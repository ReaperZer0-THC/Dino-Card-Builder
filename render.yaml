services:
  - type: web
    name: thc-dino-card-builder
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: VISION_PROVIDER
        value: openai
      - key: OPENAI_VISION_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_API_KEY
        sync: false
